apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  # Stable names so Argo CD updates the same ConfigMap instead of creating new ones
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-platform-health
    files:
      - platform-health.json
  - name: dashboard-boutique-slo
    files:
      - slo.json
  - name: dashboard-golden-signals
    files:
      - golden-signals.json
  - name: dashboard-frontend-canary
    files:
      - canary.json
  - name: dashboard-mesh
    files:
      - mesh.json
