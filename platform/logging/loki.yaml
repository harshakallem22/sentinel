deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Grafana talks to Loki directly; the nginx gateway only adds memory
gateway:
  enabled: false

# Memcached caches default to ~9 GB of memory, more than this whole cluster has
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

# Loki alert rules are not used; the rules sidecar would run without a memory limit
sidecar:
  rules:
    enabled: false
