# k3s's supported way to change its bundled Traefik; finer latency buckets so canary analysis can test P95 < 500 ms
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    metrics:
      prometheus:
        buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5"
