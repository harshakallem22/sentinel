fullnameOverride: kps

crds:
  enabled: true

# k3s runs these inside one process with no scrapeable endpoints, so their targets and alerts would always fail
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 1GB
    # Pick up monitors and rules from any app, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 160Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # k3d nodes are containers whose root is not a shared mount, which makes node-exporter fail to start
  hostRootFsMount:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  admin:
    # Created by scripts/grafana-admin-secret.sh with a random password; never in Git
    existingSecret: grafana-admin
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 320Mi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi
