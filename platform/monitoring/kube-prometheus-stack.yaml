fullnameOverride: kps

crds:
  enabled: true

# k3s runs these inside one process with no scrapeable endpoints, so their targets and alerts would always fail
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # Chart default, restated because setting this list replaces it
      - sourceLabels: [__name__, le]
        regex: >-
          (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        action: drop
      # Large histograms no rule or dashboard here uses (~12k series on a 16 GB laptop)
      - sourceLabels: [__name__]
        regex: (etcd_request|apiserver_request|apiserver_watch_list)_duration_seconds_bucket
        action: drop
      - sourceLabels: [__name__]
        regex: apiserver_(watch_cache_read_wait_seconds|response_sizes|request_body_size_bytes|watch_events_sizes)_bucket
        action: drop

kubelet:
  serviceMonitor:
    metricRelabelings:
      # Chart default, restated because setting this list replaces it
      - sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        action: drop
      # k3s serves the whole control plane from one process, so kubelet repeats the apiserver job's ~36k series
      - sourceLabels: [__name__]
        regex: (apiserver|etcd|scheduler|workqueue|rest_client|authentication|authorization|aggregator)_.*
        action: drop
      - sourceLabels: [__name__]
        regex: (watch_cache|storage|apiextensions|kube_apiserver|field_validation)_.*
        action: drop

prometheus:
  # Traefik's per-service request metrics drive canary analysis
  additionalPodMonitors:
    - name: traefik
      namespaceSelector:
        matchNames: [kube-system]
      selector:
        matchLabels:
          app.kubernetes.io/name: traefik
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          # Canary analysis reads 1-minute rates
          interval: 15s
  prometheusSpec:
    # 1 day covers a working session and keeps the head block small
    retention: 1d
    retentionSize: 512MB
    # Pick up monitors and rules from any app, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

# SLO targets come from the Day 9 baseline: P95 68 ms at ~15 req/s, 0% errors, P95 268 ms once the shop saturates
additionalPrometheusRulesMap:
  sentinel-slo:
    groups:
      - name: sentinel-slo-sli
        interval: 30s
        rules:
          - record: slo:frontend_error_ratio:rate1m
            expr: |-
              (sum(rate(traefik_service_requests_total{service=~"boutique-frontend-(stable|canary)-80@.*",code=~"5.."}[1m])) or vector(0))
              /
              sum(rate(traefik_service_requests_total{service=~"boutique-frontend-(stable|canary)-80@.*"}[1m]))
          - record: slo:frontend_error_ratio:rate5m
            expr: |-
              (sum(rate(traefik_service_requests_total{service=~"boutique-frontend-(stable|canary)-80@.*",code=~"5.."}[5m])) or vector(0))
              /
              sum(rate(traefik_service_requests_total{service=~"boutique-frontend-(stable|canary)-80@.*"}[5m]))
          - record: slo:frontend_error_ratio:rate30m
            expr: |-
              (sum(rate(traefik_service_requests_total{service=~"boutique-frontend-(stable|canary)-80@.*",code=~"5.."}[30m])) or vector(0))
              /
              sum(rate(traefik_service_requests_total{service=~"boutique-frontend-(stable|canary)-80@.*"}[30m]))
          - record: slo:frontend_latency_p95_seconds:5m
            expr: |-
              histogram_quantile(0.95,
                sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~"boutique-frontend-(stable|canary)-80@.*"}[5m])))
          - record: slo:checkout_error_ratio:rate5m
            expr: |-
              (sum(rate(traefik_router_requests_total{router=~"boutique-frontend-checkout-.*",code=~"5.."}[5m])) or vector(0))
              /
              sum(rate(traefik_router_requests_total{router=~"boutique-frontend-checkout-.*"}[5m]))
          - record: slo:checkout_error_ratio:rate30m
            expr: |-
              (sum(rate(traefik_router_requests_total{router=~"boutique-frontend-checkout-.*",code=~"5.."}[30m])) or vector(0))
              /
              sum(rate(traefik_router_requests_total{router=~"boutique-frontend-checkout-.*"}[30m]))
      - name: sentinel-slo-alerts
        rules:
          # Burn rate 14.4 against a 1% budget: the standard fast-burn factor, confirmed by a short window so it clears quickly
          - alert: FrontendErrorBudgetFastBurn
            expr: slo:frontend_error_ratio:rate5m > 0.144 and slo:frontend_error_ratio:rate1m > 0.144
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Frontend is returning over 14.4% errors (availability SLO 99%)
          - alert: FrontendErrorBudgetSlowBurn
            expr: slo:frontend_error_ratio:rate30m > 0.01 and slo:frontend_error_ratio:rate5m > 0.01
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Frontend errors are above the 1% budget over 30 minutes
          # 250 ms is ~3.7x the baseline P95 and a histogram bucket edge, so the estimate is exact at the threshold
          - alert: FrontendLatencyP95High
            expr: slo:frontend_latency_p95_seconds:5m > 0.25
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Frontend P95 latency is above 250 ms
          - alert: CheckoutSuccessLow
            expr: slo:checkout_error_ratio:rate5m > 0.01
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: More than 1% of checkouts are failing (SLO 99%)

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 160Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # k3d nodes are containers whose root is not a shared mount, which makes node-exporter fail to start
  hostRootFsMount:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  admin:
    # Created by scripts/grafana-admin-secret.sh with a random password; never in Git
    existingSecret: grafana-admin
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 320Mi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.tracing.svc.cluster.local:3200
      jsonData:
        # Jump from a span to that pod's logs around the same time
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -1m
          spanEndTimeShift: 1m
          filterByTraceID: false
          tags:
            - key: service.name
              value: app
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi
