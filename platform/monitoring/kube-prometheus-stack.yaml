fullnameOverride: kps

crds:
  enabled: true

# k3s runs these inside one process with no scrapeable endpoints, so their targets and alerts would always fail
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # Chart default, restated because setting this list replaces it
      - sourceLabels: [__name__, le]
        regex: >-
          (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        action: drop
      # Large histograms no rule or dashboard here uses (~12k series on a 16 GB laptop)
      - sourceLabels: [__name__]
        regex: (etcd_request|apiserver_request|apiserver_watch_list)_duration_seconds_bucket
        action: drop
      - sourceLabels: [__name__]
        regex: apiserver_(watch_cache_read_wait_seconds|response_sizes|request_body_size_bytes|watch_events_sizes)_bucket
        action: drop

kubelet:
  serviceMonitor:
    metricRelabelings:
      # Chart default, restated because setting this list replaces it
      - sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        action: drop
      # k3s serves the whole control plane from one process, so kubelet repeats the apiserver job's ~36k series
      - sourceLabels: [__name__]
        regex: (apiserver|etcd|scheduler|workqueue|rest_client|authentication|authorization|aggregator)_.*
        action: drop
      - sourceLabels: [__name__]
        regex: (watch_cache|storage|apiextensions|kube_apiserver|field_validation)_.*
        action: drop

prometheus:
  prometheusSpec:
    # 1 day covers a working session and keeps the head block small
    retention: 1d
    retentionSize: 512MB
    # Pick up monitors and rules from any app, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 160Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # k3d nodes are containers whose root is not a shared mount, which makes node-exporter fail to start
  hostRootFsMount:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  admin:
    # Created by scripts/grafana-admin-secret.sh with a random password; never in Git
    existingSecret: grafana-admin
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 320Mi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 128Mi
