# Applied by hand for a test run, not by Argo CD, which would re-run it on every sync
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: checkoutservice-cpu-stress
  namespace: boutique
spec:
  mode: all
  selector:
    namespaces: [boutique]
    labelSelectors:
      app: checkoutservice
  stressors:
    cpu:
      # Two busy workers are more than the 200m limit, so the pod is throttled the whole time
      workers: 2
      load: 100
  duration: 3m
