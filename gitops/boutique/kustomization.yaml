apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique

resources:
  # Unmodified release/kubernetes-manifests.yaml from Online Boutique v0.10.7 (Apache 2.0)
  - upstream/kubernetes-manifests.yaml
  - frontend-rollout.yaml
  - networkpolicies.yaml
  - mesh.yaml
  - hpa.yaml

images:
  # Built for arm64 from upstream source by scripts/build-boutique-images.sh (Google publishes amd64 only)
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
    newName: sentinel-registry:5001/boutique/adservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
    newName: sentinel-registry:5001/boutique/cartservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
    newName: sentinel-registry:5001/boutique/checkoutservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
    newName: sentinel-registry:5001/boutique/currencyservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice
    newName: sentinel-registry:5001/boutique/emailservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    newName: sentinel-registry:5001/boutique/frontend
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator
    newName: sentinel-registry:5001/boutique/loadgenerator
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    newName: sentinel-registry:5001/boutique/paymentservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice
    newName: sentinel-registry:5001/boutique/productcatalogservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice
    newName: sentinel-registry:5001/boutique/recommendationservice
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice
    newName: sentinel-registry:5001/boutique/shippingservice
  # Upstream uses the floating redis:alpine tag
  - name: redis
    newTag: 8.10.2-alpine
    digest: sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b

patches:
  # Port 80 on the node already belongs to Traefik, so this LoadBalancer would stay pending; ingress.yaml replaces it
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
  # The Rollout in frontend-rollout.yaml runs the frontend pods from this template
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      # Changing this banner is how a new frontend version is shipped without touching upstream code
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FRONTEND_MESSAGE
          value: "Sentinel release 2: shipped through a canary"
  # Services with OpenTelemetry built in send traces to our collector (same env vars as upstream's tracing component, minus its Cloud profiler)
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: frontend
  - target:
      kind: Deployment
      name: checkoutservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: checkoutservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: checkoutservice
  - target:
      kind: Deployment
      name: currencyservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: currencyservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: currencyservice
  - target:
      kind: Deployment
      name: emailservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: emailservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: emailservice
  - target:
      kind: Deployment
      name: paymentservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paymentservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: paymentservice
  - target:
      kind: Deployment
      name: productcatalogservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: productcatalogservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: productcatalogservice
  - target:
      kind: Deployment
      name: recommendationservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: recommendationservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.tracing.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: recommendationservice
  # Calls to checkoutservice go through its waypoint, where the AuthorizationPolicy is enforced
  - target:
      kind: Service
      name: checkoutservice
    patch: |-
      - op: add
        path: /metadata/labels/istio.io~1use-waypoint
        value: checkout-waypoint
  # The autoscaled backends go through a waypoint so each gRPC request, not each connection, picks a replica
  - target:
      kind: Service
      name: (currencyservice|recommendationservice)
    patch: |-
      - op: add
        path: /metadata/labels/istio.io~1use-waypoint
        value: grpc-lb-waypoint
  # Python services need >15s to start when every pod boots at once; upstream liveness killed them on Day 3
  - target:
      kind: Deployment
      name: (emailservice|recommendationservice)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          grpc: {port: 8080}
          periodSeconds: 5
          failureThreshold: 12
  # Off by default to save laptop CPU/RAM; k6 generates the measured load (scale up for background traffic)
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "3"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 300m, memory: 384Mi}
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 50m, memory: 32Mi}
