# The upstream frontend Deployment stays as the pod template (scaled to 0); this Rollout runs the pods
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
    scaleDown: never
  strategy:
    canary:
      canaryService: frontend-canary
      stableService: frontend-stable
      trafficRouting:
        traefik:
          weightedTraefikServiceName: frontend-weighted
      steps:
        - setWeight: 20
        # Give the canary traffic before the first measurement
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: frontend-canary-health
        - setWeight: 50
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: frontend-canary-health
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-stable
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: frontend-weighted
spec:
  weighted:
    services:
      - name: frontend-stable
        port: 80
        weight: 100
      - name: frontend-canary
        port: 80
        weight: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: frontend-weighted
          kind: TraefikService
---
# Its own router gives checkout its own Traefik metrics, which the checkout-success SLO is computed from
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-checkout
spec:
  entryPoints:
    - web
  routes:
    - match: Path(`/cart/checkout`) && Method(`POST`)
      kind: Rule
      services:
        - name: frontend-weighted
          kind: TraefikService
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: frontend-canary-health
spec:
  args:
    - name: service
      value: boutique-frontend-canary-80
  metrics:
    # No traffic gives an empty or NaN result, which fails: no evidence means no promotion
    - name: error-rate
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] <= 0.01
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (sum(rate(traefik_service_requests_total{service=~"{{args.service}}@.*",code=~"5.."}[1m])) or vector(0))
            /
            sum(rate(traefik_service_requests_total{service=~"{{args.service}}@.*"}[1m]))
    - name: p95-latency-seconds
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] <= 0.5
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~"{{args.service}}@.*"}[1m])))
