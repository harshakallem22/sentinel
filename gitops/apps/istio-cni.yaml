apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: cni
      targetRevision: 1.30.6
      helm:
        releaseName: istio-cni
        valueFiles:
          - $values/platform/istio/cni.yaml
    - repoURL: https://github.com/harshakallem22/sentinel.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # istiod and ztunnel need the CRDs from istio-base, synced in the same push
      - SkipDryRunOnMissingResource=true
    # Other apps' CRDs can take minutes on a fresh cluster; retry at most a minute apart instead of giving up after 5 tries
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
