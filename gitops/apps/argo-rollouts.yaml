apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.43.8
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/platform/rollouts/values.yaml
    - repoURL: https://github.com/harshakallem22/sentinel.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Its ServiceMonitor waits for kube-prometheus-stack's CRDs; the rest (incl. Rollout CRDs) should not
      - SkipDryRunOnMissingResource=true
    # Other apps' CRDs can take minutes on a fresh cluster; retry at most a minute apart instead of giving up after 5 tries
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
