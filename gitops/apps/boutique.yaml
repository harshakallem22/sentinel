apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: boutique
  source:
    repoURL: git@github.com:harshakallem22/sentinel.git
    targetRevision: main
    path: gitops/boutique
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  # Argo Rollouts changes these during a canary (traffic weights, pod-hash selectors); don't undo it
  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      managedFieldsManagers: [rollouts-controller]
    - group: ""
      kind: Service
      managedFieldsManagers: [rollouts-controller]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Enrolls every boutique pod in Istio ambient (ztunnel mTLS) without sidecars
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # Rollout and Traefik CRDs come from other apps in the same push
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
