apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: boutique
  source:
    repoURL: https://github.com/harshakallem22/sentinel.git
    targetRevision: main
    path: gitops/boutique
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  # Argo Rollouts changes these during a canary (traffic weights, pod-hash selectors); don't undo it
  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      managedFieldsManagers: [rollouts-controller]
    - group: ""
      kind: Service
      managedFieldsManagers: [rollouts-controller]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Enrolls every boutique pod in Istio ambient (ztunnel mTLS) without sidecars
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
      # Opts this namespace in to Chaos Mesh, which ignores all others
      annotations:
        chaos-mesh.org/inject: enabled
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # Rollout and Traefik CRDs come from other apps in the same push
      - SkipDryRunOnMissingResource=true
    # Other apps' CRDs can take minutes on a fresh cluster; retry at most a minute apart instead of giving up after 5 tries
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
