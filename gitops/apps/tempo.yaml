apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 3.2.0
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/tracing/tempo.yaml
    - repoURL: git@github.com:harshakallem22/sentinel.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Its ServiceMonitor waits for kube-prometheus-stack's CRDs; the rest of the app should not
      - SkipDryRunOnMissingResource=true
    # Other apps' CRDs can take minutes on a fresh cluster; retry at most a minute apart instead of giving up after 5 tries
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
