apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.1
      helm:
        releaseName: kps
        valueFiles:
          - $values/platform/monitoring/kube-prometheus-stack.yaml
    - repoURL: git@github.com:harshakallem22/sentinel.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Prometheus CRDs exceed the size limit of client-side apply annotations
      - ServerSideApply=true
