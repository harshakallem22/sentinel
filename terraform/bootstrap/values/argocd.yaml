configs:
  params:
    # TLS ends at port-forward or ingress locally; avoids self-signed cert warnings
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

controller:
  # 512Mi was OOMKilled while syncing kube-prometheus-stack (108 objects); steady use is ~330Mi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

repoServer:
  # Rendering large charts briefly needs more than 256Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 160Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
