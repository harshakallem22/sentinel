configs:
  params:
    # TLS ends at port-forward or ingress locally; avoids self-signed cert warnings
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 160Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
