apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The deployed overlay, run on an x86 runner with Google's published amd64 images
resources:
  - ../../gitops/boutique

images:
  - name: sentinel-registry:5001/boutique/adservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
  - name: sentinel-registry:5001/boutique/cartservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
  - name: sentinel-registry:5001/boutique/checkoutservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
  - name: sentinel-registry:5001/boutique/currencyservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
  - name: sentinel-registry:5001/boutique/emailservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice
  - name: sentinel-registry:5001/boutique/frontend
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
  - name: sentinel-registry:5001/boutique/loadgenerator
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator
  - name: sentinel-registry:5001/boutique/paymentservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
  - name: sentinel-registry:5001/boutique/productcatalogservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice
  - name: sentinel-registry:5001/boutique/recommendationservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice
  - name: sentinel-registry:5001/boutique/shippingservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice

patches:
  # kind has no Argo Rollouts or Traefik: run the frontend from its Deployment instead
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      metadata:
        name: frontend
  - patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: AnalysisTemplate
      metadata:
        name: frontend-canary-health
  - patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: TraefikService
      metadata:
        name: frontend-weighted
  # kind has no Istio either
  - patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: checkout-waypoint
  - patch: |-
      $patch: delete
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: checkoutservice-allow-frontend
  - patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: frontend
  - patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: frontend-checkout
  # Private-repo runners have 2 vCPUs, so the real CPU requests cannot all be scheduled next to the control plane
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
